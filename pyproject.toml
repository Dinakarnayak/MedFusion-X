[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medfusion-x"
version = "0.1.0"
description = "Multimodal medical AI research pipeline with adaptive fusion and uncertainty estimation."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "transformers>=4.45",
  "accelerate>=0.34", "datasets>=2.20", "open_clip_torch>=2.26",
  "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.4", "pyyaml>=6.0",
  "pillow>=10.0", "tqdm>=4.66", "matplotlib>=3.8", "seaborn>=0.13",
  "safetensors>=0.4"
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["medfusion_x*"]
